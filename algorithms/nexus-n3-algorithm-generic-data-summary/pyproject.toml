[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-n3-algorithm-generic-data-summary"
version = "0.1.0"
description = "Generic data summary algorithm plugin for Nexus N3 OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nexus-n3-plugin-sdk>=0.1.0",
]

[project.entry-points."nexus_n3.algorithms"]
generic_data_summary = "generic_data_summary.core:GenericDataSummaryAlgorithm"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
generic_data_summary = ["*.yaml", "plugin.json"]

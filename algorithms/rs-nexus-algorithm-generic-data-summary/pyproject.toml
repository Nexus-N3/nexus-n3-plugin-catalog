[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-nexus-algorithm-generic-data-summary"
version = "0.1.0"
description = "Generic data summary algorithm plugin for RS Nexus OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rs-nexus-plugin-sdk>=0.1.0",
]

[project.entry-points."rs_nexus.algorithms"]
generic_data_summary = "generic_data_summary.core:GenericDataSummaryAlgorithm"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
generic_data_summary = ["*.yaml", "plugin.json"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-n3-sensor-core-2"
version = "0.1.1"
description = "Core 2 sensor plugin for Nexus N3 OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nexus-n3-plugin-sdk>=0.1.0",
]

[project.entry-points."nexus_n3.sensors"]
core_2 = "nexus_n3_sensor_core_2.sensor:Core2Sensor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_n3_sensor_core_2 = ["*.yaml", "plugin.json"]

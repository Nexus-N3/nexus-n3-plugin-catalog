[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-nexus-sensor-movella-dot"
version = "0.1.0"
description = "Movella DOT sensor plugin for RS Nexus OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rs-nexus-plugin-sdk>=0.1.0",
  "numpy>=1.24",
]

[project.entry-points."rs_nexus.sensors"]
movella_dot = "rs_nexus_sensor_movella_dot.sensor:MovellaDotSensor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rs_nexus_sensor_movella_dot = ["*.yaml", "plugin.json"]

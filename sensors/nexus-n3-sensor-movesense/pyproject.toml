[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-n3-sensor-movesense"
version = "0.1.2"
description = "Movesense ECG sensor plugin for Nexus N3 OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nexus-n3-plugin-sdk>=0.1.0",
]

[project.entry-points."nexus_n3.sensors"]
movesense = "nexus_n3_sensor_movesense.sensor:MovesenseSensor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_n3_sensor_movesense = ["*.yaml", "plugin.json"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-nexus-sensor-movesense"
version = "0.1.2"
description = "Movesense ECG sensor plugin for RS Nexus OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rs-nexus-plugin-sdk>=0.1.0",
]

[project.entry-points."rs_nexus.sensors"]
movesense = "rs_nexus_sensor_movesense.sensor:MovesenseSensor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rs_nexus_sensor_movesense = ["*.yaml", "plugin.json"]

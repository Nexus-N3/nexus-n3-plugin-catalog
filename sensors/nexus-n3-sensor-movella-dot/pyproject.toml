[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-n3-sensor-movella-dot"
version = "0.1.0"
description = "Movella DOT sensor plugin for Nexus N3 OS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nexus-n3-plugin-sdk>=0.1.0",
  "numpy>=1.24",
]

[project.entry-points."nexus_n3.sensors"]
movella_dot = "nexus_n3_sensor_movella_dot.sensor:MovellaDotSensor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_n3_sensor_movella_dot = ["*.yaml", "plugin.json"]
